name: Benchmark validation

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "src/benchmark*.ts"
      - "tests/benchmark*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/benchmark-validation.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - "src/benchmark*.ts"
      - "tests/benchmark*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/benchmark-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bench:validate
